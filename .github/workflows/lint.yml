name: lint
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
      - name: No unconditional dependency on another suite's skills
        run: python3 tools/check-cross-suite-references.py --foreign-file tools/cross-suite-foreign.txt skills
      - name: Installed subagent bundle matches upstream sources
        run: python3 tools/generate-subagents.py --check
      - name: Skill lint and runtime command tests
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Guide promise ledger and model-free promise checks
        run: |
          python3 evals/promises/ledger.py audit
          python3 -m unittest discover -s evals/promises -p 'test_*.py'
      - name: Verify-command oracle contract tests
        working-directory: evals/verify-commands/oracles
        run: |
          docker pull python:3.12-slim@sha256:229a2c5bfa27522db7815ea81f9bed70af17ccb9de9fc7ad142b1877b5830d36
          python3 -m unittest -v test_check_plan
      - name: Install uv for the skill-ci harness
        run: python3 -m pip install --require-hashes -r tools/uv-requirements.txt
      - name: Install the skill-ci command, which runs the version .skill-ci.toml pins
        run: |
          uv tool install "git+https://github.com/mdsmithaustin/skill-ci.git"
          uv tool dir --bin >> "$GITHUB_PATH"
      - name: Canon screen and oracle unit tests
        working-directory: evals/canon
        run: |
          docker pull python:3.12-slim@sha256:229a2c5bfa27522db7815ea81f9bed70af17ccb9de9fc7ad142b1877b5830d36
          python3 -m unittest -v
      - name: Real npx skill installations preserve complete personas
        run: python3 tools/probe-subagent-install.py
      - name: pstack-models.md lint tests
        run: python3 -m unittest discover -s tests/skills/setup-pstack/scripts -p 'test_*.py'
      - name: pstack-models.md shipped default lints clean
        run: python3 skills/setup-pstack/scripts/check-models-config.py skills/setup-pstack/examples/pstack-models.md
      - name: Install poteto-mode script dependencies
        working-directory: skills/poteto-mode/scripts
        run: bun install --frozen-lockfile
      - name: poteto-mode script tests
        working-directory: skills/poteto-mode/scripts
        run: bun run test
      - name: poteto-mode script typecheck
        working-directory: skills/poteto-mode/scripts
        run: bun run typecheck
  worktree-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install rg and jq for worktree-audit.sh
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep jq
      - name: Guide promise worktree-cleanup-classifies-worktrees
        working-directory: evals/promises
        run: |
          set -o pipefail
          python3 -m unittest -v test_scripts.WorktreeAuditPromises 2>&1 | tee worktree-audit.log
          grep -q "test_worktree_cleanup_classifies_worktrees .* \.\.\. ok$" worktree-audit.log
