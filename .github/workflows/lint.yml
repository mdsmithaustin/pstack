name: lint
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Python lint dependency
        run: python3 -m pip install --require-hashes -r tools/requirements.txt
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
      - name: No unconditional dependency on another suite's skills
        run: python3 tools/check-cross-suite-references.py --foreign-file tools/cross-suite-foreign.txt skills
      - name: Installed subagent bundle matches upstream sources
        run: python3 tools/generate-subagents.py --check
      - name: Skill lint and runtime command tests
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Verify-command oracle contract tests
        working-directory: evals/verify-commands/oracles
        run: |
          docker pull python:3.12-slim@sha256:229a2c5bfa27522db7815ea81f9bed70af17ccb9de9fc7ad142b1877b5830d36
          python3 -m unittest -v test_check_plan
      - name: Read the skill-ci commit that skill-checks.yml pins
        id: skill-ci
        run: |
          set -euo pipefail
          sha=$(sed -n 's|^ *uses: mdsmithaustin/skill-ci/.github/workflows/skill-checks.yml@\([0-9a-f]\{40\}\)$|\1|p' .github/workflows/skill-checks.yml)
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::.github/workflows/skill-checks.yml pins no full skill-ci commit"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mdsmithaustin/skill-ci
          ref: ${{ steps.skill-ci.outputs.sha }}
          path: .skill-ci
          persist-credentials: false
      - name: Install uv for the skill-ci harness
        run: python3 -m pip install --require-hashes -r tools/uv-requirements.txt
      - name: Canon screen and oracle unit tests
        working-directory: evals/canon
        env:
          SKILL_CI: ${{ github.workspace }}/.skill-ci
        run: |
          docker pull python:3.12-slim@sha256:229a2c5bfa27522db7815ea81f9bed70af17ccb9de9fc7ad142b1877b5830d36
          python3 -m unittest -v
      - name: Real npx skill installations preserve complete personas
        run: python3 tools/probe-subagent-install.py
      - name: pstack-models.md lint tests
        run: python3 -m unittest discover -s skills/setup-pstack/scripts -p 'test_*.py'
      - name: pstack-models.md shipped default lints clean
        run: python3 skills/setup-pstack/scripts/check-models-config.py skills/setup-pstack/examples/pstack-models.md
      - name: Install poteto-mode script dependencies
        working-directory: skills/poteto-mode/scripts
        run: bun install --frozen-lockfile
      - name: poteto-mode script tests
        working-directory: skills/poteto-mode/scripts
        run: bun run test
      - name: poteto-mode script typecheck
        working-directory: skills/poteto-mode/scripts
        run: bun run typecheck
