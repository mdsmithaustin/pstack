# Written by skill-ci init. The version this runs is the one in .skill-ci.toml. The job installs whatever skill-ci the
# source serves, and that skill-ci runs the pinned version.
name: skill-checks
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  skill-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SKILL_CI_SOURCE: "https://github.com/mdsmithaustin/skill-ci.git"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pip install uv==0.12.7
      - run: uv tool run --from "git+$SKILL_CI_SOURCE" skill-ci check
