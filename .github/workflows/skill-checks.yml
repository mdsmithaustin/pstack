name: skill-checks
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  skills:
    uses: mdsmithaustin/skill-ci/.github/workflows/skill-checks.yml@193db3b208a89420feb12d16d12a04cebb46c4df
    with:
      skills-dir: skills
      evals-dir: evals
      trigger-cases: tools/skill-trigger-cases.json
      pii-scope: repository
      content-conventions-file: tools/skill-content-conventions.json
