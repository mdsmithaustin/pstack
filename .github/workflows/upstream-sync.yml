name: Upstream pstack sync

# Manual dispatch requires the configured repository secret.
on:
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gate on new upstream pstack commits
        id: gate
        run: |
          git remote add upstream https://github.com/cursor/plugins.git
          git fetch upstream main --quiet
          latest=$(git rev-list -1 upstream/main -- pstack)
          recorded=$(cat .github/upstream-sha)
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "recorded=$recorded" >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$recorded" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Upstream unchanged at $latest; nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if a sync PR is already open
        id: dup
        if: steps.gate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --search 'head:sync/upstream' --json number --jq length)
          echo "open=$open" >> "$GITHUB_OUTPUT"
          [ "$open" = "0" ] || echo "A sync PR is already open; skipping until it lands."

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.gate.outputs.changed == 'true' && steps.dup.outputs.open == '0'
        with:
          python-version: "3.12"

      - name: Install the skill-ci command, which runs the version .skill-ci.toml pins
        if: steps.gate.outputs.changed == 'true' && steps.dup.outputs.open == '0'
        run: |
          python3 -m pip install --require-hashes -r tools/uv-requirements.txt
          uv tool install "git+https://github.com/mdsmithaustin/skill-ci.git"
          uv tool dir --bin >> "$GITHUB_PATH"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.gate.outputs.changed == 'true' && steps.dup.outputs.open == '0'
        with:
          bun-version: "1.4.0"

      - name: Port upstream changes
        if: steps.gate.outputs.changed == 'true' && steps.dup.outputs.open == '0'
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          claude_args: '--allowedTools "Bash,Read,Write,Edit,Glob,Grep"'
          prompt: |
            You are in mdsmithaustin/pstack, a CLI-agnostic port of the
            `pstack/` directory of cursor/plugins. The `upstream` remote is
            fetched.

            Read PORTING.md at the repo root in full, then follow its
            "Syncing from upstream" procedure with these inputs:
            - Recorded upstream commit: ${{ steps.gate.outputs.recorded }}
              (in .github/upstream-sha).
            - Latest upstream commit touching pstack/:
              ${{ steps.gate.outputs.latest }}.
            - Publish route: this checkout commits .no-mistakes.yaml but
              has no initialized no-mistakes gate. Prepare the sync, then
              stop before pushing or opening a PR. Report publication as
              blocked, the upstream commits, local branch and head, checks,
              and the need to resume in an initialized gated checkout.
              This temporary checkout does not preserve local commits for
              the maintainer. The workflow token is not a gate exemption.

            That procedure is the only sync procedure. Nothing in this prompt
            overrides it.
