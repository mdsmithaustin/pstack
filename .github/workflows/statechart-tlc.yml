name: statechart-tlc
permissions:
  contents: read
on:
  push:
    branches: [main]
    paths:
      - "skills/statechart/**"
      - "tests/skills/statechart/**"
      - ".github/workflows/statechart-tlc.yml"
  pull_request:
    paths:
      - "skills/statechart/**"
      - "tests/skills/statechart/**"
      - ".github/workflows/statechart-tlc.yml"
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  tlc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
      - name: Download the TLC jar and pick the Java that run.ts pins
        run: |
          set -euo pipefail
          pin=$(node -e '
            const text = require("fs").readFileSync("skills/statechart/scripts/run.ts", "utf8");
            const [, sha, version] = text.match(/checksum=sha256:([0-9a-f]{64})\]@(\S+?)"/);
            const [, major] = text.match(/^const JAVA_TOOL = "java@temurin-(\d+)";$/m);
            console.log(sha, version, major);
          ')
          read -r sha version major <<< "$pin"
          jar="$RUNNER_TEMP/tla2tools.jar"
          curl --fail --silent --show-error --location --output "$jar" \
            "https://github.com/tlaplus/tlaplus/releases/download/v${version}/tla2tools.jar"
          echo "$sha  $jar" | sha256sum -c -
          java_home="JAVA_HOME_${major}_X64"
          : "${!java_home:?this runner image has no Java ${major}}"
          echo "TLA2TOOLS=$jar" >> "$GITHUB_ENV"
          echo "JAVA=${!java_home}/bin/java" >> "$GITHUB_ENV"
      - name: Install statechart test dependencies
        working-directory: tests/skills/statechart/scripts
        run: bun install --frozen-lockfile
      - name: statechart script tests with TLC, none skipped for lack of TLC
        working-directory: tests/skills/statechart/scripts
        run: |
          set -euo pipefail
          node --disable-warning=ExperimentalWarning --test --test-reporter=tap test/*.test.ts | tee "$RUNNER_TEMP/tap.txt"
          grep -Eq '^# tests [1-9]' "$RUNNER_TEMP/tap.txt"
          if grep -E '# SKIP set TLA2TOOLS' "$RUNNER_TEMP/tap.txt"; then
            exit 1
          fi
