{
  "pre-commit": {
    "commands": {
      "cross-suite-references": {
        "run": "{python} tools/check-cross-suite-references.py --foreign-file tools/cross-suite-foreign.txt skills"
      },
      "personal-paths": {
        "run": "{python} tools/check-personal-paths.py --source index"
      },
      "skill-ci-check-fast": {
        "run": "skill-ci check --fast"
      }
    }
  },
  "pre-push": {
    "commands": {
      "personal-paths": {
        "run": "{python} tools/check-personal-paths.py --source pre-push",
        "use_stdin": true
      },
      "skill-ci-check": {
        "run": "skill-ci check"
      }
    }
  },
  "templates": {
    "python": "\"$(git rev-parse --path-format=absolute --git-common-dir)/../.venv/bin/python\""
  }
}
